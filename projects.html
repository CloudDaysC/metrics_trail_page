<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metric Trails® Certified Courses Catalog</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #ffffff;
    }

    h1 {
      text-align: center;
      margin-bottom: 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: #f9f9f9;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .link-card:hover {
      background: #eaf2ff;
      border-color: #c9dafc;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }

    .link-card img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      border-radius: 8px;
      flex-shrink: 0;
      background: white;
    }

    .link-card .content {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .link-card h3 {
      font-size: 1.05rem;
      margin: 0 0 4px 0;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-card p {
      margin: 0;
      color: #666;
      font-size: 0.9rem;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
